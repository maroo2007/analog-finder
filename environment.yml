# Rebuild the project environment with:
#   conda env create -f environment.yml
#   conda activate analog
#
# Solving takes roughly 15 minutes; GDAL is the slow part. That is normal.
#
# Python is pinned to 3.11 because rasterio and GDAL lag behind the newest
# releases. If 3.11 ever refuses to solve, move to 3.12. Do not jump to 3.13
# or 3.14.
#
# conda-forge only. Anaconda defaults are deliberately not used.

name: analog

channels:
  - conda-forge

dependencies:
  - python=3.11

  # Raster and vector IO
  - rasterio
  - gdal
  - geopandas

  # Numerics, tables, plotting
  - numpy
  - pandas
  - matplotlib

  # Feature tables saved as Parquet
  - pyarrow

  # Similarity search and feature scaling
  - scikit-learn

  # Notebooks
  - jupyterlab

  # Known-answer tests (tests/), run with: pytest -m network
  - pytest

  # Reading text out of NASA PDFs. NASA publishes no coordinate table for
  # the Artemis III candidate landing regions in its releases; the one we
  # use is a table inside an NTRS presentation (see src/targets/).
  - pypdf

  # Data fetching: OpenTopography and AppEEARS (Plan B), Earth Engine (Plan A)
  - requests
  - earthengine-api

# Set on `conda activate analog`. Without it, conda-forge's MKL crashes the
# process on Windows with 0xC06D007F (a failed delayed DLL load) and no
# Python error, for example while reading the Moon DEM (terrain.moon_patch).
variables:
  MKL_THREADING_LAYER: SEQUENTIAL
